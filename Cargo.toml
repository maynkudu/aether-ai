[package]
name = "aether-ai"
version = "0.2.0"
license = "MIT"
edition = "2021"
[[bin]]
name = "aether"
path = "src/main.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lib]
name = "aether_core"
path = "src/lib.rs"

[workspace]
resolver = "2"
