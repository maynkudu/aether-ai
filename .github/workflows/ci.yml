name: CI and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  linux:
    name: Linux build and smoke
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed git rust python base-devel quickshell sway mesa dbus util-linux ttf-dejavu seatd libcap
          rustc -Vv
          qs --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate metadata and scripts
        shell: bash
        run: |
          python scripts/release_check.py
          bash -n install.sh
          bash -n shell/install.sh
          bash -n scripts/ci-smoke.sh
          python -m py_compile scripts/update.py scripts/release_check.py scripts/test_backend.py shell/fetch-brand-icons.py shell/fetch-fonts.py
      - name: Rust build and integration tests
        shell: bash
        run: |
          if [[ ! -f Cargo.lock ]]; then cargo generate-lockfile; fi
          cargo test --locked
          cargo build --release --locked
          python scripts/test_backend.py target/release/aether
      - name: Headless Quickshell startup and IPC
        shell: bash
        run: |
          # Arch Sway may carry cap_sys_nice=ep, outside the default Docker
          # capability bounding set. Remove that file capability in this
          # disposable CI container only; no privileged container is needed.
          sway_bin="$(command -v sway)"
          getcap "$sway_bin"
          if [[ -n "$(getcap "$sway_bin")" ]]; then
            setcap -r "$sway_bin"
          fi
          useradd --create-home aether-ci
          runuser -u aether-ci -- "$sway_bin" --version
          mkdir -p /tmp/aether-ci/target/release
          cp -a shell scripts /tmp/aether-ci/
          cp target/release/aether /tmp/aether-ci/target/release/
          chown -R aether-ci:aether-ci /tmp/aether-ci
          set -o pipefail
          runuser -u aether-ci -- dbus-run-session -- bash /tmp/aether-ci/scripts/ci-smoke.sh 2>&1 | tee ci-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-diagnostics
          path: ci-smoke.txt
          if-no-files-found: ignore
      - name: Package tested Linux build
        shell: bash
        run: |
          mkdir -p dist
          mkdir -p /tmp/aether-src
          git archive --format=tar --prefix=aether-ai/ HEAD | tar -xf - -C /tmp/aether-src
          cp Cargo.lock /tmp/aether-src/aether-ai/
          tar -czf dist/aether-source.tar.gz -C /tmp/aether-src aether-ai
          tar -czf dist/aether-arch-linux-x86_64.tar.gz -C target/release aether -C "$GITHUB_WORKSPACE" shell/shell.qml scripts/update.py systemd LICENSE README.md CHANGELOG.md Cargo.lock
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux
          path: dist/
          if-no-files-found: error
  desktop:
    name: Desktop preview (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install current stable Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -Vv
      - name: Compile portable core and desktop frontend
        shell: bash
        run: |
          if [[ ! -f Cargo.lock ]]; then cargo generate-lockfile; fi
          cargo test -p aether-ai --locked
          cargo build --release -p aether-ai -p aether-desktop --locked
      - name: Mock Codex integration (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/test_backend.py target/release/aether
      - name: Mock Codex integration (Windows)
        if: runner.os == 'Windows'
        run: python scripts/test_backend.py target/release/aether.exe
      - name: Native frontend binary self-test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: target/release/aether-desktop --self-test
      - name: Native frontend binary self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path target/release/aether-desktop.exe) -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Desktop self-test failed" }
      - name: Windows CLI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XDG_CACHE_HOME = Join-Path $env:RUNNER_TEMP "aether-ci-cache"
          $env:XDG_STATE_HOME = Join-Path $env:RUNNER_TEMP "aether-ci-state"
          $data = & target/release/aether.exe usage | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not ($data.PSObject.Properties.Name -contains "accounts")) { throw "Cache smoke failed" }
          $history = & target/release/aether.exe history 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $history.source -ne "local-quota-snapshots") { throw "History smoke failed" }
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, package | Out-Null
          Copy-Item target/release/aether-desktop.exe,target/release/aether.exe,LICENSE -Destination package
          Copy-Item apps/desktop/README.md package/README.md
          Copy-Item docs/assets/logo.png package/logo.png
          Compress-Archive -Path package/* -DestinationPath dist/aether-windows-x64.zip
      - name: Package macOS preview
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist "package/aether.ai.app/Contents/MacOS"
          cp apps/desktop/macos/Info.plist "package/aether.ai.app/Contents/"
          cp target/release/aether-desktop "package/aether.ai.app/Contents/MacOS/"
          cp target/release/aether "package/"
          mkdir -p "package/aether.ai.app/Contents/Resources"
          iconset="$(mktemp -d)/aether.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" docs/assets/logo.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            pixels=$((size * 2))
            sips -z "$pixels" "$pixels" docs/assets/logo.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "package/aether.ai.app/Contents/Resources/aether.icns"
          cp LICENSE "package/"
          cp apps/desktop/README.md "package/README.md"
          plutil -lint "package/aether.ai.app/Contents/Info.plist"
          codesign --force --sign - "package/aether.ai.app"
          codesign --verify "package/aether.ai.app"
          ditto -c -k --sequesterRsrc --keepParent package "dist/aether-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: aether-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          # Stable releases must carry their dependency lock in source control.
          git ls-files --error-unmatch Cargo.lock
          python3 scripts/release_check.py --tag "$TAG" --notes release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: aether-*
          merge-multiple: true
          path: dist
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum -c SHA256SUMS && sha256sum *.tar.gz *.zip > SHA256SUMS)
          gh release create "$TAG" --verify-tag --draft --title "aether.ai $TAG" --notes-file release-notes.md dist/*
