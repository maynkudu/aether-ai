name: CI and releases
on:
  # Ordinary commits and pull requests do not consume hosted runner time.
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  prepare:
    name: Validate Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate versions and notes
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 scripts/test_release_check.py
          python3 scripts/release_check.py
          if [[ "$REF_TYPE" == tag ]]; then
            python3 scripts/release_check.py --tag "$TAG"
            git ls-files --error-unmatch Cargo.lock
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor HEAD origin/main
          fi
  linux:
    needs: prepare
    name: Linux build and smoke
    runs-on: ubuntu-latest
    container:
      image: archlinux:base
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed git rust python base-devel quickshell sway mesa dbus util-linux ttf-dejavu seatd libcap
          rustc -Vv
          qs --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate metadata and scripts
        shell: bash
        run: |
          python scripts/release_check.py
          python scripts/test_branding.py
          bash -n install.sh
          bash -n shell/install.sh
          bash -n scripts/ci-smoke.sh
          python -m py_compile scripts/update.py scripts/release_check.py scripts/test_backend.py scripts/test_installation.py shell/fetch-brand-icons.py shell/fetch-fonts.py
      - name: Rust build and integration tests
        shell: bash
        run: |
          if [[ ! -f Cargo.lock ]]; then cargo generate-lockfile; fi
          cargo test --locked
          cargo build --release --locked
          python scripts/test_backend.py target/release/aether
          python scripts/test_installation.py
      - name: Headless Quickshell startup and IPC
        shell: bash
        run: |
          # Arch Sway may carry cap_sys_nice=ep, outside the default Docker
          # capability bounding set. Remove that file capability in this
          # disposable CI container only; no privileged container is needed.
          sway_bin="$(command -v sway)"
          getcap "$sway_bin"
          if [[ -n "$(getcap "$sway_bin")" ]]; then
            setcap -r "$sway_bin"
          fi
          useradd --create-home aether-ci
          runuser -u aether-ci -- "$sway_bin" --version
          mkdir -p /tmp/aether-ci/target/release
          cp -a shell scripts /tmp/aether-ci/
          cp target/release/aether /tmp/aether-ci/target/release/
          chown -R aether-ci:aether-ci /tmp/aether-ci
          set -o pipefail
          runuser -u aether-ci -- dbus-run-session -- bash /tmp/aether-ci/scripts/ci-smoke.sh 2>&1 | tee ci-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-diagnostics
          path: ci-smoke.txt
          if-no-files-found: ignore
      - name: Package tested Linux build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          # Checkout is owned by the host runner; trust only this known
          # workspace for the archive command, not every repository.
          git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" archive --format=tar --prefix=aether-ai/ HEAD > "$stage/source.tar"
          tar -xf "$stage/source.tar" -C "$stage"
          cp Cargo.lock "$stage/aether-ai/"
          tar -czf dist/aether-source.tar.gz -C "$stage" aether-ai
          tar -czf dist/aether-arch-linux-x86_64.tar.gz -C "$GITHUB_WORKSPACE/target/release" aether -C "$GITHUB_WORKSPACE" shell/shell.qml scripts/update.py systemd LICENSE README.md CHANGELOG.md Cargo.lock docs/assets/logo.svg docs/assets/logo.png docs/assets/branding
          # Check the actual archives before uploading them.
          tar -tzf dist/aether-source.tar.gz > "$stage/source-files.txt"
          tar -tzf dist/aether-arch-linux-x86_64.tar.gz > "$stage/binary-files.txt"
          grep -Fx 'aether-ai/Cargo.lock' "$stage/source-files.txt"
          grep -Fx 'aether-ai/shell/shell.qml' "$stage/source-files.txt"
          grep -Fx 'aether' "$stage/binary-files.txt"
          grep -Fx 'shell/shell.qml' "$stage/binary-files.txt"
          grep -Fx 'systemd/aether-ui.service' "$stage/binary-files.txt"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: aether-linux
          path: dist/
          if-no-files-found: error
  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and notes
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          # Stable releases must carry their dependency lock in source control.
          git ls-files --error-unmatch Cargo.lock
          python3 scripts/release_check.py --tag "$TAG" --notes release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: aether-linux
          path: dist
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          flags=(--draft)
          case "$TAG" in
            *-alpha.*|*-beta.*|*-rc.*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" --verify-tag "${flags[@]}" --title "aether.ai $TAG" --notes-file release-notes.md dist/aether-arch-linux-x86_64.tar.gz dist/aether-source.tar.gz dist/SHA256SUMS
